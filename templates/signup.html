{% extends "base.html" %}
{% block title %}Create Account — Mini Mail{% endblock %}
{% block content %}
<div class="auth-wrapper">
  <div class="auth-box" style="max-width:480px;">
    <div class="auth-logo">
      <div class="auth-logo-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
          <polyline points="22,6 12,13 2,6"/>
        </svg>
      </div>
      <span class="auth-logo-text">Mini Mail</span>
    </div>

    <h2 class="auth-title">Create account</h2>
    <p class="auth-subtitle">Join Cipher and start messaging privately</p>

    <div class="card">
      <form method="post">
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px;">
          <div class="form-group">
            <label class="form-label">Full Name <span style="color:var(--rose)">*</span></label>
            <input type="text" name="name" class="form-control" placeholder="Jane Doe" required>
          </div>
          <div class="form-group">
            <label class="form-label">Phone <span style="color:var(--text-3); font-size:10px;">(optional)</span></label>
            <input type="text" name="phone" class="form-control" placeholder="+91 98765 43210">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">User ID <span style="color:var(--rose)">*</span></label>
          <input type="text" name="user_id" class="form-control" placeholder="jane_doe" pattern="[A-Za-z0-9_]{3,30}" required>
          <p class="form-hint">Used by others to send you messages</p>
        </div>

        <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px;">
          <div class="form-group">
            <label class="form-label">Password <span style="color:var(--rose)">*</span></label>
            <input type="password" name="password" class="form-control" placeholder="min 6 chars" required>
          </div>
          <div class="form-group">
            <label class="form-label">Confirm Password <span style="color:var(--rose)">*</span></label>
            <input type="password" name="confirm_password" class="form-control" placeholder="repeat password" required>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-full" style="margin-top:4px;">
          Create Account
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="5" y1="12" x2="19" y2="12"/>
            <polyline points="12 5 19 12 12 19"/>
          </svg>
        </button>
      </form>
    </div>

    <p class="text-sm text-muted mt-16" style="text-align:center;">
      Already have an account? <a href="{{ url_for('login') }}" class="auth-link">Sign in</a>
    </p>
  </div>
</div>
{% endblock %}
