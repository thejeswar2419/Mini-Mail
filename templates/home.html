{% extends "base.html" %}
{% block title %}Mini Mail — Private Messaging{% endblock %}
{% block content %}
<div class="auth-wrapper home-animated" style="max-width:1200px; margin:0 auto;">

  <div class="home-grid">
    <!-- Left Column: Copy & Actions -->
    <div class="home-hero-text">
      <div class="auth-logo anim-logo" style="margin-bottom:24px;">
        <div class="auth-logo-icon icon-pulse">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
            <polyline points="22,6 12,13 2,6"/>
          </svg>
        </div>
        <span class="auth-logo-text">Mini Mail</span>
      </div>

      <div class="home-badge anim-badge">Premium Workspace Messaging</div>

      <h1 class="home-title anim-title">Connect instantly.<br>Communicate quietly.</h1>

      <div class="home-actions anim-actions" style="justify-content: flex-start; margin-top: 40px;">
        <a href="{{ url_for('signup') }}" class="btn btn-primary btn-hero">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
            <circle cx="9" cy="7" r="4"/>
            <line x1="19" y1="8" x2="19" y2="14"/>
            <line x1="22" y1="11" x2="16" y2="11"/>
          </svg>
          Create Account
        </a>
        <a href="{{ url_for('login') }}" class="btn btn-ghost btn-hero">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
            <polyline points="10 17 15 12 10 7"/>
            <line x1="15" y1="12" x2="3" y2="12"/>
          </svg>
          Sign In
        </a>
      </div>
    </div>

    <!-- Right Column: Illustration -->
    <div class="home-hero-image anim-image">
      <img src="{{ url_for('static', filename='images/hero.png') }}" alt="Secure messaging abstract illustration">
    </div>
  </div>

</div>

<style>
.home-animated { position: relative; padding: 40px 20px; min-height: calc(100vh - 80px); display: flex; align-items: center; }

.home-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 60px;
  align-items: center;
  width: 100%;
}

.home-hero-text {
  max-width: 580px;
}

.home-title {
  font-family: 'Syne', sans-serif;
  font-weight: 800;
  font-size: 52px;
  letter-spacing: -1.5px;
  line-height: 1.1;
  margin-bottom: 24px;
  background: linear-gradient(135deg, var(--text-1) 0%, var(--accent-2) 60%, var(--cyan) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

/* Blinking cursor on title */
.home-title::after {
  content: '|';
  animation: blink 1.1s step-end infinite;
  color: var(--accent);
  font-weight: 300;
  margin-left: 4px;
}
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

.home-hero-image {
  position: relative;
  display: flex;
  justify-content: center;
  align-items: center;
}

.home-hero-image img {
  width: 100%;
  max-width: 600px;
  height: auto;
  border-radius: var(--radius-lg);
  /* The floating animation */
  animation: floatImage 8s ease-in-out infinite;
  box-shadow: 0 30px 60px rgba(0,0,0,0.6), 0 0 80px rgba(139,92,246,0.2);
  border: 1px solid var(--border-2);
}

@keyframes floatImage {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-20px); }
}

/* Icon glow pulse */
.icon-pulse { animation: iconGlow 3s ease-in-out infinite; }
@keyframes iconGlow {
  0%,100% { box-shadow: 0 0 16px var(--accent-glow); }
  50%      { box-shadow: 0 0 48px var(--accent-glow), 0 0 96px rgba(124,106,247,0.12); }
}

/* Bigger hero buttons */
.btn-hero { padding: 14px 32px; font-size: 14px; }

/* Entrance animations */
.anim-logo    { animation: fadeSlideDown 0.65s cubic-bezier(0.22,1,0.36,1) both; }
.anim-badge   { animation: fadeSlideDown 0.65s 0.12s cubic-bezier(0.22,1,0.36,1) both; }
.anim-title   { animation: fadeSlideUp   0.75s 0.22s cubic-bezier(0.22,1,0.36,1) both; }
.anim-actions { animation: fadeSlideUp   0.75s 0.36s cubic-bezier(0.22,1,0.36,1) both; }
.anim-image   { animation: fadeZoomIn    1s 0.4s cubic-bezier(0.22,1,0.36,1) both; }

@keyframes fadeSlideDown {
  from { opacity: 0; transform: translateY(-18px); }
  to   { opacity: 1; transform: translateY(0); }
}
@keyframes fadeSlideUp {
  from { opacity: 0; transform: translateY(22px); }
  to   { opacity: 1; transform: translateY(0); }
}
@keyframes fadeZoomIn {
  from { opacity: 0; transform: scale(0.95) translateY(20px); }
  to   { opacity: 1; transform: scale(1) translateY(0); }
}

/* Responsive */
@media (max-width: 992px) {
  .home-grid {
    grid-template-columns: 1fr;
    text-align: center;
    gap: 40px;
  }
  .home-hero-text {
    max-width: 100%;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .auth-logo { margin: 0 auto 24px; }
  .home-actions { justify-content: center !important; }
  .home-title { font-size: 42px; }
}
@media (max-width: 600px) {
  .home-title { font-size: 32px; }
}
</style>
{% endblock %}
